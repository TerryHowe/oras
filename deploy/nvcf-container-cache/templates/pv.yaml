apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $.Chart.Name }}-pv
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app: {{ $.Release.Name }}
    {{- include "nvcf-container-cache.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ $.Values.pvc.size | default "10Gi" | quote }}
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/container_cache"