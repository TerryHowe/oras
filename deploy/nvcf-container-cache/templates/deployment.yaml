apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app: {{ $.Release.Name }}
    {{- include "nvcf-container-cache.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nvcf-container-cache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nvcf-container-cache.labels" . | nindent 8 }}
	{{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
    {{- with $.Values.image.secrets }}
      imagePullSecrets:
    {{- range $idx, $item := . }}
      - name: {{ $item }}
    {{- end }}
    {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ required "Property '.image.repository' is required." $.Values.image.repository | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: container-cache
              mountPath: /container_cache
        - name: nginx-prometheus-exporter
          image: nginx/nginx-prometheus-exporter:1.0
          args:
            - '-nginx.scrape-uri=http://localhost/nginx_status'
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
      volumes:
        - name: container-cache
          persistentVolumeClaim:
            claimName: {{ $.Chart.Name }}-pvc
