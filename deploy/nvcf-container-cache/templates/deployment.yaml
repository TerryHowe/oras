apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app: {{ $.Release.Name }}
    {{- include "nvcf-container-cache.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nvcf-container-cache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nvcf-container-cache.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
    {{- with $.Values.images.secrets }}
      imagePullSecrets:
    {{- range $idx, $item := . }}
      - name: {{ $item }}
    {{- end }}
    {{- end }}
      containers:
        - name: nginx-proxy
          image: {{ required "Property '.images.server' is required." $.Values.images.server | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
            - name: cache-metrics
              containerPort: {{ .Values.metrics.cacheMetricsPort | default 9145 }}
              protocol: TCP
          volumeMounts:
            - name: container-cache
              mountPath: /container_cache
            - name: nginx-config
              mountPath: /conf
        - name: nginx-prometheus-exporter
          image: {{ required "Property '.images.exporter' is required." $.Values.images.exporter | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - '-nginx.scrape-uri=http://localhost/nginx_status'
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.prometheusExporterPort | default 9113 }}
      volumes:
        - name: container-cache
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-pvc
        - name: nginx-config
          configMap: 
            name: {{ $.Release.Name }}-config
        
