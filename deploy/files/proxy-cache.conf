    # The caching layer
    server {

        # For access logs
        set $docker_proxy_request_type "nvcf-proxy-cache";
        set $disable_cache "0";

        log_by_lua_block {
            local cache_status = ngx.var.upstream_cache_status
            local request_uri = ngx.var.request_uri
            local body_size = ngx.var.body_bytes_sent
            local remote_addr = ngx.var.remote_addr
            local request_time = ngx.var.request_time
            local http_status = ngx.var.status
            local request_method = ngx.var.request_method
            local upstream_time = ngx.var.upstream_response_time
            local host = ngx.var.host
            if request_uri ~= nil and cache_status ~= nil and remote_addr ~= nil and not string.find(request_uri, "manifest") then
                if request_time ~= nil then
                    proxy_http_request_time_ms_total:inc(tonumber(request_time), {request_method, cache_status, http_status})
                    proxy_http_requests_count:inc(1, {request_method, cache_status, http_status})

                    metric_latency:observe(tonumber(request_time), {host, request_method, cache_status, http_status})
                    if body_size ~= nil then
                        proxy_cache_throughput:observe(tonumber(body_size) / tonumber(request_time), {cache_status, http_status})
                        if upstream_time ~= nil then
                          proxy_cache_upstream_throughput:observe(tonumber(body_size) / tonumber(upstream_time), {host, http_status})
                          metric_upstream_latency:observe(tonumber(upstream_time), {host, request_method, cache_status, http_status})
                        end
                    end
                end

                if body_size ~= nil then
                    proxy_response_body_size:set(tonumber(body_size), {cache_status, http_status})
                    metric_response_sizes:observe(tonumber(body_size))
                end
            end
        }

        # OV Application relies on If-Match header to guaranty client receives the content it requested.
        # They add If-Match header as part of S3 signature. Nginx will drop If-Match header and won't forward
        # it to S3. We need to forward this header to S3 for Signature verification to work. The block of code
        # below is a WAR for the If-Match requirement.

        slice 4m;
        proxy_set_header Range $slice_range;

        set_by_lua_block $filtered_args {
          local args = ngx.req.get_uri_args()
          local filtered = {}
          for k, v in pairs(args) do
            if k ~= "versionId" and k ~= "X-Amz-Algorithm" and
              k ~= "X-Amz-Credential" and k ~= "X-Amz-Date" and
              k ~= "X-Amz-Expires" and k ~= "X-Amz-Signature" then
              filtered[k] = v
            end
          end
          return ngx.encode_args(filtered)
        }

        # Listen on 14128, for all hostnames.
        listen 14128 ssl default_server reuseport;
        http2 on;
        server_name ~^(?<bucket_name>[^\.]+)(\.s3(\.(?<bucket_region>[^\.]+))?)?\.amazonaws\.com$;
        proxy_cache proxy_cache;

        ssl_verify_client optional;
        proxy_ssl_protocols TLSv1.3;
        ssl_protocols TLSv1.3;
        ssl_certificate /etc/certs/ssl-bundle.crt;
        ssl_certificate_key /etc/certs/leaf-ca.key;
        ssl_client_certificate /etc/ssl/certs/ca-certificates.crt;
        lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        ssl_certificate_by_lua_file /etc/nginx/conf.d/lua/lua-ssl.lua;

        # Copied from GFN proxy-cache
        sendfile on;
        tcp_nopush on;
        #tcp_nodelay on;
        aio threads;
        reset_timedout_connection on;
        server_tokens off; # Don't reveal OpenResty version to clients.

        # Timeout Configuration
        keepalive_timeout  300s;
        send_timeout 60s;
        client_body_timeout 60s;
        client_header_timeout 60s;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Configure cache size and Path
        proxy_http_version 1.1;
        proxy_cache_convert_head off;
        proxy_cache_methods GET HEAD;
        proxy_ssl_server_name on;
        proxy_buffering on;
        proxy_cache_valid 200 206 {{ $.Values.cache.valid | default "1d" }};
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $cookie_nocache $arg_nocache $http_pragma;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status;

        # Logging config
        access_log /dev/stdout main;

        # local=on only works with openresty
        resolver local=on ipv6=off;

        chunked_transfer_encoding on;

        # Use cache locking
        # This forces additional requests to wait to be served through the cache
        # until the first request for the same resource is completed, helping cut bandwidth costs.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_lock_age 10s;

        # Some extra settings to maximize cache hits and efficiency
        proxy_force_ranges on;
        proxy_ignore_client_abort on;

        # Verify SSL certs, and use the system CA bundle.
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 2;
        proxy_ssl_session_reuse off;

        # Lua SSL config
        lua_ssl_verify_depth 2;

        location  / {
          proxy_pass_request_headers on;

          # Configures cache bypass based on the Cache-Control header.
          if ($http_cache_control ~* "no-cache") {
            set $disable_cache "1";
          }

          proxy_cache_bypass $disable_cache;
          proxy_set_header If-Match $http_if_match;

          proxy_cache_key $bucket_region|$bucket_name|$request_method|$uri|$arg_versionId|$http_if_match|$filtered_args|$slice_range;
          access_by_lua_file /etc/nginx/conf.d/lua/lua-access.lua;
          proxy_set_header Host $host;
          proxy_pass $scheme://$host;
        }
    }
