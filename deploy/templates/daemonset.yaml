apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $.Release.Name }}-cc
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app: {{ $.Release.Name }}
    {{ include "nvcf-container-cache.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      name: configure-containerd
  template:
    metadata:
      labels:
        name: configure-containerd
    spec:
      hostPID: true
      hostIPC: true
      hostNetwork: true
      serviceAccountName: container-cache
    {{- with $.Values.images.secrets }}
      imagePullSecrets:
    {{- range $idx, $item := . }}
        - name: {{ $item }}
    {{- end }}
    {{- end }}
      containers:
      - name: configure
        image: {{ $.Values.images.certificates }}
        env:
        - name: TARGET_HOST
          value: {{ $.Values.targetHost | default "nvcr.io" | quote }}
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: VAULT_ENABLED
          value: {{ $.Values.vault.enabled | default false | quote }}
        - name: CERT_LOCATION
          value: {{ $.Values.vault.certLocation | quote }}
        securityContext:
          privileged: true
        volumeMounts:
        - name: etc-containerd
          mountPath: /host/etc/containerd
        - name: etc-containers
          mountPath: /host/etc/containers
        - name: etc-crio
          mountPath: /host/etc/crio
        - name: ssl-certs
          mountPath: /host/etc/ssl/
        - name: crio-utils
          mountPath: /opt/nvcf/crio
          readOnly: true
        - name: update-config
          mountPath: /opt/nvcf/containerd
          readOnly: true
        command: ["/bin/bash"]
        args:
        - -c
        - |
          hosts=(${TARGET_HOST//,/ })
          crio_mirror_host="{{ $.Values.crio.mirrorHost | default (printf "nvcf-container-cache.%s.svc.cluster.local" $.Release.Namespace) }}"
          declare -A CRIO_PORTS
{{- $crioPorts := include "nvcf-container-cache.crioRegistryPorts" . | fromYaml -}}
{{- if $crioPorts }}
{{- range $name, $val := $crioPorts }}
          CRIO_PORTS["{{ $val.registry }}"]="{{ $val.port }}"
{{- end }}
{{- end }}

          get_cache_pod_ips() {
            python3 /opt/nvcf/crio/get_cache_pod_ips.py
          }

          update_crio_mirrors() {
            if [ ! -d /host/etc/containers ]; then
              return 0
            fi
            mkdir -p /host/etc/containers/registries.conf.d
            crio_conf="/host/etc/containers/registries.conf.d/nvcf-container-cache.conf"
            : > "${crio_conf}"
            mapfile -t cache_pod_ips < <(get_cache_pod_ips || true)
            local has_cache_ips="false"
            if [ "${#cache_pod_ips[@]}" -gt 0 ]; then
              has_cache_ips="true"
            fi
            for host in "${hosts[@]}"; do
              port="{{ $.Values.service.port }}"
              if [ -n "${CRIO_PORTS[$host]:-}" ]; then
                port="${CRIO_PORTS[$host]}"
              fi
              printf '%s\n' \
                "[[registry]]" \
                "location = \"${host}\"" \
                "prefix = \"${host}\"" \
                "pull-from-mirror = \"all\"" \
                "mirror-by-digest-only = false" \
                >> "${crio_conf}"
              if [ "${has_cache_ips}" = "true" ]; then
                for ip in "${cache_pod_ips[@]}"; do
                  printf '%s\n' \
                    "[[registry.mirror]]" \
                    "location = \"${ip}:${port}\"" \
                    "insecure = false" \
                    >> "${crio_conf}"
                done
              else
                printf '%s\n' \
                  "[[registry.mirror]]" \
                  "location = \"${crio_mirror_host}:${port}\"" \
                  "insecure = true" \
                  >> "${crio_conf}"
              fi
              printf '%s\n' "" >> "${crio_conf}"
              if [ "${has_cache_ips}" = "true" ]; then
                for ip in "${cache_pod_ips[@]}"; do
                  printf '%s\n' \
                    "[[registry]]" \
                    "location = \"${ip}:${port}\"" \
                    "prefix = \"${ip}:${port}\"" \
                    "insecure = false" \
                    "" >> "${crio_conf}"
                done
              else
                printf '%s\n' \
                  "[[registry]]" \
                  "location = \"${crio_mirror_host}:${port}\"" \
                  "prefix = \"${crio_mirror_host}:${port}\"" \
                  "insecure = true" \
                  "" >> "${crio_conf}"
                printf '%s\n' \
                  "[[registry]]" \
                  "location = \"${NODE_IP}:${port}\"" \
                  "prefix = \"${NODE_IP}:${port}\"" \
                  "insecure = true" \
                  "" >> "${crio_conf}"
              fi
            done
            mkdir -p /host/etc/crio/crio.conf.d
            printf '%s\n' \
              "[crio]" \
              "log_level = \"debug\"" \
              "" \
              "[crio.image]" \
              "auto_reload_registries = true" \
              > /host/etc/crio/crio.conf.d/99-nvcf-registry.conf
            crio_main="/host/etc/containers/registries.conf"
            if [ -f "${crio_main}" ]; then
              unqualified=$(python3 -c 'from pathlib import Path; p=Path("/host/etc/containers/registries.conf"); lines=p.read_text().splitlines(); print(next((l for l in lines if l.strip().startswith("unqualified-search-registries")), ""))')
              : > "${crio_main}"
              if [ -n "${unqualified}" ]; then
                printf '%s\n\n' "${unqualified}" >> "${crio_main}"
              fi
              cat "${crio_conf}" >> "${crio_main}"
            fi
            if [ "${has_cache_ips}" = "true" ]; then
              for host in "${hosts[@]}"; do
                port="{{ $.Values.service.port }}"
                if [ -n "${CRIO_PORTS[$host]:-}" ]; then
                  port="${CRIO_PORTS[$host]}"
                fi
                for ip in "${cache_pod_ips[@]}"; do
                  mkdir -p "/host/etc/containers/certs.d/${ip}:${port}"
                  cp /host/etc/ssl/nginx_container_cache.crt "/host/etc/containers/certs.d/${ip}:${port}/ca.crt"
                done
              done
            else
              for host in "${hosts[@]}"; do
                port="{{ $.Values.service.port }}"
                if [ -n "${CRIO_PORTS[$host]:-}" ]; then
                  port="${CRIO_PORTS[$host]}"
                fi
                mkdir -p "/host/etc/containers/certs.d/${crio_mirror_host}:${port}"
                cp /host/etc/ssl/nginx_container_cache.crt "/host/etc/containers/certs.d/${crio_mirror_host}:${port}/ca.crt"
                mkdir -p "/host/etc/containers/certs.d/${NODE_IP}:${port}"
                cp /host/etc/ssl/nginx_container_cache.crt "/host/etc/containers/certs.d/${NODE_IP}:${port}/ca.crt"
              done
            fi
            # Rely on auto_reload_registries=true instead of explicit reload.
            # if command -v nsenter >/dev/null 2>&1; then
            #   nsenter -t 1 -m -u -i -n -p -- systemctl reload crio >/dev/null 2>&1 || true
            # fi
          }

          if [ "${VAULT_ENABLED}" = "true" ]; then
            if [ -z "${CERT_LOCATION}" ]; then
              echo "CERT_LOCATION must be set when VAULT_ENABLED=true" >&2
              exit 1
            fi
            curl -fsSL "${CERT_LOCATION}" -o /host/etc/ssl/nginx_container_cache.crt
          else
            cp /ca/root.crt.pem /host/etc/ssl/nginx_container_cache.crt
          fi

          if [ -d /host/etc/containerd ]; then
            rm -rf /host/etc/containerd/certs.d/*
            for host in "${hosts[@]}"; do
              echo "$host"
              mkdir -p /host/etc/containerd/certs.d/$host
              cat <<EOF >/host/etc/containerd/certs.d/$host/hosts.toml
              server = "https://$host"
              [host."https://${NODE_IP}:{{ $.Values.service.port }}"]
              capabilities = ["pull", "resolve"]
              ca = "/etc/ssl/nginx_container_cache.crt"
              skip_verify = true
              [host."https://$host"]
              capabilities = ["pull", "resolve"]
          EOF
            done
            python3 /opt/nvcf/containerd/update_config.py /host/etc/containerd/config.toml
          fi

          if [ -d /host/etc/containers ]; then
            update_crio_mirrors
          fi

          while true; do
            if [ -d /host/etc/containers ]; then
              update_crio_mirrors
            fi
            sleep 300
          done
      volumes:
      - name: etc-containerd
        hostPath:
          path: /etc/containerd
      - name: etc-containers
        hostPath:
          path: /etc/containers
          type: DirectoryOrCreate
      - name: etc-crio
        hostPath:
          path: /etc/crio
          type: DirectoryOrCreate
      - name: ssl-certs
        hostPath:
          path: /etc/ssl
      - name: crio-utils
        configMap:
          name: nvcf-crio-utils
      - name: update-config
        configMap:
          name: nvcf-update-config
