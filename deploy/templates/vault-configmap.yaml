apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ $.Release.Name }}-vault-config
    namespace: {{ $.Release.Namespace | quote }}
data:
  config.hcl: |                        # Config for Vault Agent Sidecar container
    "auto_auth" = {
      "method" = {
        "type" = "jwt"
        "mount_path" = "auth/jwt/{{ .Values.vault.clusterCSP }}/{{ .Values.vault.clusterAccountName }}/regions/{{ .Values.vault.clusterRegion }}/{{ .Values.vault.clusterName }}"
        "namespace" = "nvcf"
        "config" = {
          "path" = "/var/run/secrets/kubernetes.io/serviceaccount-vault/token"
          "role" = "container-cache"
          skip_jwt_cleanup = true
        }
      }
      "sink" = {
        "config" = {
          "path" = "/home/vault/.token"        # Use different paths for containers
        }
        "type" = "file"
      }
    }

    "exit_after_auth" = false                  # false for Vault Agent Sidecar container

    "pid_file" = "/home/vault/.pid"

    "template" {
      "source" = "/vault/configs/template.hcl"
      "destination" = "/vault/secrets/secrets_pkiCert.tmp"
      "exec" {
        "command" = "cat /vault/secrets/nginx-proxy.pem.tmp /vault/secrets/certs/ca_chain.pem > /vault/secrets/certs/nginx-proxy.pem && wget -O- http://127.0.0.1:13129/reload || echo"
      }
      error_on_missing_key = true
    }

    "vault" = {
      "address" = "{{ .Values.vault.vaultAddress }}"
    }

  config-init.hcl: |                   # Config for Vault Agent Init container
    "auto_auth" = {
      "method" = {
        "type" = "jwt"
        "mount_path" = "auth/jwt/{{ .Values.vault.clusterCSP }}/{{ .Values.vault.clusterAccountName }}/regions/{{ .Values.vault.clusterRegion }}/{{ .Values.vault.clusterName }}"
        "namespace" = "nvcf"
        "config" = {
          "path" = "/var/run/secrets/kubernetes.io/serviceaccount-vault/token"
          "role" = "container-cache"
          skip_jwt_cleanup = true
        }
      }
      "sink" = {
        "config" = {
         "path" = "/home/vault/.token-init"    # Use different paths for containers
        }
        "type" = "file"
      }
    }
    "exit_after_auth" = true                   # true for Vault Agent Init container
    "pid_file" = "/home/vault/.pid"

    "template" {
      "source" = "/vault/configs/template.hcl"
      "destination" = "/vault/secrets/secrets_pkiCert.tmp"
      "exec" {
        "command" = "cat /vault/secrets/nginx-proxy.pem.tmp /vault/secrets/certs/ca_chain.pem > /vault/secrets/certs/nginx-proxy.pem"
      }
      error_on_missing_key = true
    }
    
    "vault" = {
      "address" = "{{ .Values.vault.vaultAddress }}"
    }

  template.hcl: |
    {{ "{{" }} with pkiCert `/cloud/{{ .Values.vault.clusterCSP }}/{{ .Values.vault.clusterAccountName }}/services/container-cache/regions/{{ .Values.vault.clusterRegion }}/{{ .Values.vault.clusterName }}/pki/server/01/issue/server` `common_name=container-cache.container-caching.svc.cluster.local` `private_key_format=pkcs8` `ip_sans={{ .Values.vault.hostIP }}` {{ "}}" }}
      {{ "{{" }} .Cert {{ "}}" }} {{ "{{" }} .CA {{ "}}" }} {{ "{{" }} .Key {{ "}}" }}
      {{ "{{" }} .Key | writeToFile "/vault/secrets/certs/nginx-proxy.key" "" "" "0644" {{ "}}" }}
      {{ "{{" }} .Cert | writeToFile "/vault/secrets/nginx-proxy.pem.tmp" "" "" "0644" {{ "}}" }}
    {{ "{{" }} end {{ "}}" }}
    {{ "{{" }} with secret `/cloud/{{ .Values.vault.clusterCSP }}/{{ .Values.vault.clusterAccountName }}/services/container-cache/regions/{{ .Values.vault.clusterRegion }}/{{ .Values.vault.clusterName }}/pki/server/01/cert/ca_chain` {{ "}}" }}
    {{ "{{" }} .Data.ca_chain | writeToFile "/vault/secrets/certs/ca_chain.pem" "" "" "0644" {{ "}}" }}
    {{ "{{" }} end {{ "}}" }}
