apiVersion: v1
kind: ConfigMap
metadata:
  name: nvcf-nginx-config
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app: {{ $.Release.Name }}
    {{- include "nvcf-container-cache.labels" . | nindent 4 }}
data:
  nginx.conf: |-
    user  nvs;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;

    pid        /var/run/nginx.pid;

    events {  
        # TODO: In staging, run grep processor /proc/cpuinfo | wc -l and calculate a better max
        # https://serverfault.com/questions/787919/optimal-value-for-nginx-worker-connections
        worker_connections  10000; 
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        # Cache Metrics are updated at every log request processing phase.
        lua_shared_dict cache_metrics {{ $.Values.metrics.cacheMetricsStorageSize | default "32m" }};

        lua_shared_dict certs_crt 32m;
        lua_shared_dict certs_crl 32m;
        lua_shared_dict certs_key 1m;
        init_by_lua_file /etc/nginx/conf.d/lua/lua-gen-key.lua;

        # Cache Metrics
        init_worker_by_lua_block {
            prometheus = require("prometheus").init("cache_metrics")

            http_request_time_ms_total = prometheus:counter(
                "container_cache_http_requests_time_ms_total", "Sum of time elapsed between reading the first bytes from the client and writing a log entry after the last bytes were sent for each request", {"request_uri", "cache_status", "client_ip", "http_status"})

            http_requests_count = prometheus:counter(
                "container_cache_http_requests_count", "Count of requests with additional labels", {"request_uri", "cache_status", "client_ip", "http_status"})

            response_body_size = prometheus:gauge(
                "container_cache_response_body_size_bytes", "Number of bytes sent to client, not counting the response header", {"request_uri", "cache_status", "client_ip", "http_status"})
            
            cache_throughput = prometheus:histogram(
                "container_cache_throughput", "Throughput of container cache(bytes/msec)", {"cache_status", "http_status"}, { {{ $.Values.metrics.throughputHistogramBuckets | default "25000000, 30000000, 35000000, 40000000, 50000000, 60000000, 80000000, 100000000" }} })

            proxy_http_request_time_ms_total = prometheus:counter(
                "proxy_cache_http_requests_time_ms_total", "Sum of time elapsed between reading the first bytes from the client and writing a log entry after the last bytes were sent for each request", {"request_uri", "cache_status", "client_ip", "http_status"})

            proxy_http_requests_count = prometheus:counter(
                "proxy_cache_http_requests_count", "Count of requests with additional labels", {"request_uri", "cache_status", "client_ip", "http_status"})

            proxy_response_body_size = prometheus:gauge(
                "proxy_cache_response_body_size_bytes", "Number of bytes sent to client, not counting the response header", {"request_uri", "cache_status", "client_ip", "http_status"})

            proxy_cache_throughput = prometheus:histogram(
                "proxy_cache_throughput", "Throughput of proxy cache(bytes/msec)", {"cache_status", "http_status"}, { {{ $.Values.metrics.throughputHistogramBuckets | default "25000000, 30000000, 35000000, 40000000, 50000000, 60000000, 80000000, 100000000" }} })

        }

        
        # Logging Configuration
        log_format main escape=json
        '{'
            '"access_time":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status":"$status",'
            '"bytes_sent":"$body_bytes_sent",'
            '"host":"$host",'
            '"proxy_host":"$proxy_host",'
            '"upstream":"$upstream_addr"'
            '"upstream_status":"$upstream_status",'
            '"ssl_protocol":"$ssl_protocol",'
            '"upstream_http_location":"$upstream_http_location",'
            '"upstream_cache_status":"$upstream_cache_status",'
            '"connection":"$connection",'
            '"connection_requests":"$connection_requests",'
            '"request_uri":"$request_uri",'
            '"upstream_response_time":"$upstream_response_time",'
            '"request_time":"$request_time",'
            '"docker_proxy_request_type":"$docker_proxy_request_type",'
            '"disable_cache":"$disable_cache",'
            # '"http_authorization":"$http_authorization",' # Keep Auth out of the logs unless debugging
        '}';


        gzip off;
        # Configure cache size and Path
        proxy_cache_path /container_cache levels=1:2 max_size={{ $.Values.cache.maxSize | default "80g" }} inactive={{ $.Values.cache.valid | default "60d" }} keys_zone=container:{{ $.Values.cache.keyStorageSize | default "10m" }} use_temp_path=off;
        proxy_cache_path /proxy_cache levels=1:2 max_size={{ $.Values.cache.maxSize | default "80g" }} inactive={{ $.Values.cache.valid | default "60d" }} keys_zone=proxy_cache:{{ $.Values.cache.keyStorageSize | default "10m" }} use_temp_path=off;

        include /etc/nginx/conf.d/sites/default.conf;
        include /etc/nginx/conf.d/sites/container-cache.conf;
        include /etc/nginx/conf.d/sites/proxy-cache.conf;

    }
