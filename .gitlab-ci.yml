###########################################
# Imported Modules
###########################################
include:
  # package and publish nvcf-container-cache Helm chart
  - component: gitlab-master.nvidia.com/cds/cds-components/helm-package@0.16.6
    inputs:
      job-name: helm-package:nvcf-container-cache
      chart-path: deploy
      extends: [.helm-package]

  - component: gitlab-master.nvidia.com/cds/cds-components/helm-push-ngc@0.16.6
    inputs:
      job-name: helm-push-ngc:nvcf-container-cache:nv-ngc-devops:no-team
      package-job: helm-package:nvcf-container-cache
      ngc-key: $NGC_API_KEY_nv_ngc_devops
      ngc-path: ${NGC_ORG_nv_ngc_devops}
      extends: [.helm-push-ngc:nvcf-container-cache]

  - component: gitlab-master.nvidia.com/cds/cds-components/helm-push-ngc@0.16.6
    inputs:
      job-name: helm-push-ngc:nvcf-container-cache:nvcf-internal:no-team
      package-job: helm-package:nvcf-container-cache
      ngc-key: $NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL
      ngc-path: ${NGC_ORG_nvcf_internal}
      extends: [.helm-push-ngc:nvcf-container-cache]

  - component: gitlab-master.nvidia.com/cds/cds-components/helm-push-ngc@0.16.6
    inputs:
      job-name: helm-push-ngc:nvcf-container-cache:nvstaging:nvcf-byoc
      package-job: helm-package:nvcf-container-cache
      ngc-key: $NGC_API_KEY_nv_ngc_devops
      ngc-path: nvstaging/nvcf-byoc
      extends: [.helm-push-ngc:nvcf-container-cache]

###########################################
# Common Settings
###########################################

default:
  tags:
    - prod
    - eks
    - nvcf-cds

.common-settings:
  image: ${CI_REGISTRY}/cds/cds-containers/tools:latest

stages:
  - check
  - code-quality
  - build
  - package
  - publish

workflow:
  rules:
    # Run pipeline on merge requests (for testing/validation only)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run pipeline on main branch (for manual operations)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Run pipeline on tags (for automatic chart publishing)
    - if: $CI_COMMIT_TAG

variables:
  NGC_ORG_nv_ngc_devops: nv-ngc-devops
  NGC_ORG_nvcf_internal: 0544956542906249
  NGC_ORG_nvstaging: nvstaging

#####################
# package
#####################

.helm-package:
  stage: package
  rules:
    # Package chart when a tag is created (for publishing)
    - if: '$CI_COMMIT_TAG'
      when: always
    # Allow manual packaging on main branch (for testing)
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    # Skip packaging on MR events (no need to package if not publishing)
    - when: never
  before_script:
    - helm repo add ${NGC_ORG_nv_ngc_devops} https://helm.ngc.nvidia.com/${NGC_ORG_nv_ngc_devops} --username '$oauthtoken' --password $NGC_API_KEY_nv_ngc_devops
    - helm repo add ${NGC_ORG_nvcf_internal} https://helm.ngc.nvidia.com/${NGC_ORG_nvcf_internal} --username '$oauthtoken' --password $NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL
    - helm repo add ${NGC_ORG_nvstaging} https://helm.ngc.nvidia.com/nvstaging/nvcf-byoc --username '$oauthtoken' --password $NGC_API_KEY_nv_ngc_devops
    - helm repo update

#####################
# publish
#####################

# Helm - Only publish on tags, not on MR merges
.helm-push-ngc:nvcf-container-cache:
  stage: publish
  rules:
    # Automatically publish chart when a tag is created
    - if: '$CI_COMMIT_TAG'
      when: always
    # Allow manual publishing on main branch for testing (optional)
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

#####################
# build (SBOM)
#####################

# Render Helm chart so the SBOM generator can scan for image references.
# Chart has no external dependencies, so no repo setup is needed.
build:template:
  stage: build
  image: ${CI_REGISTRY}/cds/cds-containers/tools:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p rendered
    - helm template container-cache ./deploy --output-dir rendered/
    - echo "Rendered $(find rendered/ -name '*.yaml' | wc -l) manifest files"
  artifacts:
    paths:
      - rendered/
    expire_in: 1 day

# Generate SPDX 2.3 SBOM and plain-text artifact list from rendered manifests.
# Satisfies SRD REQ-1 (SPDX SBOM) and REQ-1.1 (artifact text file).
build:sbom:
  stage: build
  image: ${CI_REGISTRY}/ncp/nvcf/tools/self-hosted-sbom-tools:1.5.2
  needs:
    - job: build:template
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG}"
    - mkdir -p sbom-artifacts helmfile.d
    - |
      generate-sbom --format=sbom,text \
        --scan-registries="nvcr.io" \
        -d ./rendered -o ./sbom-artifacts local
    - mv ./sbom-artifacts/sbom-local.spdx.json "./sbom-artifacts/sbom-${VERSION}.spdx.json"
    - mv ./sbom-artifacts/artifacts-local.txt "./sbom-artifacts/artifacts-${VERSION}.txt"
    - echo "Generated artifacts:"
    - ls -la sbom-artifacts/
  artifacts:
    paths:
      - sbom-artifacts/
