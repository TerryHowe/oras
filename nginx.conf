user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;

pid        /var/run/nginx.pid;


events {  
    # TODO: In staging, run grep processor /proc/cpuinfo | wc -l and calculate a better max
    # https://serverfault.com/questions/787919/optimal-value-for-nginx-worker-connections
    worker_connections  10000; 
}


http {
    
    map_hash_bucket_size 128;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Load Lua libraries
    lua_package_path "/usr/src/openresty-1.21.4.3/bundle/lua-resty-core-0.1.27/lib/?.lua;;";
    
    # Logging Configuration
    log_format main escape=json
      '{'
        '"access_time":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":"$status",'
        '"bytes_sent":"$body_bytes_sent",'
        '"host":"$host",'
        '"proxy_host":"$proxy_host",'
        '"upstream":"$upstream_addr"'
        '"upstream_status":"$upstream_status",'
        '"ssl_protocol":"$ssl_protocol",'
        '"connect_host":"$connect_host",'
        '"connect_port":"$connect_port",'
        '"connect_addr":"$connect_addr",'
        '"upstream_http_location":"$upstream_http_location",'
        '"upstream_cache_status":"$upstream_cache_status",'
        # '"http_authorization":"$http_authorization",' # Keep Auth out of the logs unless debugging
      '}';

    # Timeout Configuration
    keepalive_timeout  300s;
    send_timeout 60s;
    client_body_timeout 60s;
    client_header_timeout 60s;

    proxy_connect_connect_timeout 60s;
    proxy_connect_read_timeout 60s;
    proxy_connect_send_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    gzip  off;
   
    # Configure cache size and Path
    # Set to 2TB, and 60 days of inactivity for now.
    proxy_cache_path /container_cache levels=1:2 max_size=2000g inactive=60d keys_zone=cache:10m use_temp_path=off;
    map $host $targetHost {
        hostnames;
        default $host;
    }
    # A map to enable authentication to some specific docker registries.
    map $host $dockerAuth {
        hostnames;
        default "";
    }

    map $dockerAuth $finalAuth {
        "" "$http_authorization";    # if empty, keep the original passed-in from the docker client.
        default "Basic $dockerAuth"; # if not empty, add the Basic preamble to the auth
    }

    map $connect_host $interceptedHost {
        hostnames;
        nvcr.io 127.0.0.1:443;
        default "$connect_addr"; # $connect_addr is the IP:port of the remote host, e.g. "192.168.1.5:12345". IP address is resolved from host name of CONNECT request line.'
    }

    # These maps parse the original Host and URI from a /forcecache redirect.
    map $request_uri $realHost {
        ~/forcecacheinsecure/([^:/]+)/originalwas(/.+) $1;
        ~/forcecachesecure/([^:/]+)/originalwas(/.+) $1;
        default "DID_NOT_MATCH_HOST";
    }

    map $request_uri $realPath {
        ~/forcecacheinsecure/([^:/]+)/originalwas(/.+) $2;
        ~/forcecachesecure/([^:/]+)/originalwas(/.+) $2;
        default "DID_NOT_MATCH_PATH";
    }

    # Proxy Config, listens on 13128
    server {
        listen 13128;
        listen [::]:13128;
        server_name proxy_director_;

        # dont log the CONNECT proxy.
        access_log off;
        set $docker_proxy_request_type "unknown-connect";

        proxy_connect;
        proxy_connect_allow all;
        proxy_connect_address $interceptedHost;
        proxy_max_temp_file_size 0;

        # We need to resolve the real names of our proxied servers.
        # This is generated by our startup script and is the value of the /etc/resolv.conf resolver
        include /etc/nginx/resolver.conf;

        # forward proxy for non-CONNECT request
        location / {
            access_by_lua_file /etc/nginx/auth_check.lua;
            add_header "Content-type" "text/plain" always;
            return 200 "docker-registry-proxy: The docker caching proxy is working!";
        }

    } # End of Proxy config

    # The caching layer
    server {
        # Listen on both 80 and 443, for all hostnames.

        listen 80 default_server;
        listen 443 ssl default_server;
        server_name proxy_caching_;
        # Logging config
        access_log  /var/log/nginx/access.log main;
        set $docker_proxy_request_type "unknown";
        # Send upstream status as header
        add_header X-Docker-Registry-Proxy-Cache-Upstream-Status "$upstream_cache_status";
        # Use Generated certs
        ssl_certificate /certs/fullchain.pem;
        ssl_certificate_key /certs/cache.key;
        # We need to resolve the real names of our proxied servers.
        # This is generated by our startup script and is the value of the /etc/resolv.conf resolver
        include /etc/nginx/resolver.conf;
        
        chunked_transfer_encoding on;
        # Only GET from the Cache
        if ($request_method = POST) {
            return 405 "POST method is not allowed";
        }
        if ($request_method = PUT) {
            return 405 "PUT method is not allowed";
        }
        if ($request_method = DELETE) {
            return 405  "DELETE method is not allowed";
        }

        # If the request is for a /forcecache redirect, then we need to handle it specially.
        proxy_read_timeout 900;

        # Use cache locking
        # This forces additional requests to wait to be served through the cache
        # until the first request for the same resource is completed, helping cut bandwidth costs.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 880s;

        # Cache all 200, 206 for 60 days.
        proxy_cache_valid 200 206 60d;
        # Some extra settings to maximize cache hits and efficiency
        proxy_force_ranges on;
        proxy_ignore_client_abort on;
        proxy_cache_revalidate on;

        # Hide/ignore headers from caching. S3 especially likes to send Expires headers in the past in some situations.
        proxy_hide_header      Set-Cookie;
        proxy_ignore_headers   X-Accel-Expires Expires Cache-Control Set-Cookie;

        # Add the authentication info, if the map matched the target domain.
        proxy_set_header Authorization $finalAuth;

        # Use SNI during the TLS handshake with the upstream.
        proxy_ssl_server_name on;

        # Verify SSL certs, and use the system CA bundle.
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 2;

        # For blob requests by digest, do cache, and treat redirects.
        location ~ ^/v2/(.*)/blobs/sha256:(.*) {
            set $docker_proxy_request_type "blob-by-digest";
            add_header X-Docker-Registry-Proxy-Cache-Upstream-Status "$upstream_cache_status";
            add_header X-Docker-Registry-Proxy-Cache-Type "$docker_proxy_request_type";
            proxy_pass https://$targetHost;
            proxy_cache cache;
            proxy_cache_key   $uri;
            proxy_intercept_errors on;
            error_page 301 302 307 = @handle_redirects;
        }

        # For manifest requests by digest, do cache, and treat redirects.
        location ~ ^/v2/(.*)/manifests/sha256:(.*) {
            set $docker_proxy_request_type "manifest-by-digest";
            add_header X-Docker-Registry-Proxy-Cache-Upstream-Status "$upstream_cache_status";
            add_header X-Docker-Registry-Proxy-Cache-Type "$docker_proxy_request_type";
            proxy_pass https://$targetHost;
            proxy_cache cache;
            proxy_cache_key   $uri;
            proxy_intercept_errors on;
            error_page 301 302 307 = @handle_redirects;

        }

        location ~ ^/v2/(.*)/manifests/ {
            set $docker_proxy_request_type "manifest-caching-enabled";
            proxy_pass https://nvcr.io;
            proxy_set_header Host nvcr.io;
            proxy_set_header Authorization $http_authorization;
            # Cache Manifests
            proxy_cache cache;
            # Manifest cache valid for 60 minutes
            proxy_cache_valid 200 206 60m;  
            # enables revalidation of expired cached responses using conditional GET requests.
            proxy_cache_revalidate on;
            # allows serving stale content from the cache while Nginx is updating the cache in the background.
            proxy_cache_use_stale updating; 
        }

        # Cache blobs requests that are not by digest
        # Since these are mutable, we invalidate them immediately and keep them only in case the backend is down
        location ~ ^/v2/(.*)/blobs/ {
            set $docker_proxy_request_type "blob-mutable";
            proxy_cache_valid 0s;
            proxy_pass https://nvcr.io;
            proxy_set_header Host nvcr.io;
            proxy_set_header Authorization $http_authorization;
            # Cache Manifests
            proxy_cache cache;
            # Manifest cache valid for 60 minutes
            proxy_cache_valid 200 206 60m;  
            # enables revalidation of expired cached responses using conditional GET requests.
            proxy_cache_revalidate on;
            # allows serving stale content from the cache while Nginx is updating the cache in the background.
            proxy_cache_use_stale updating; 
            proxy_cache_use_stale  error timeout http_500 http_502 http_504 http_429; 
        }

        location @handle_redirects {
            # Capture redirect values before they are stripped by Connect module
            set $original_uri $uri;
            set $orig_loc $upstream_http_location;

            proxy_set_header      Authorization "";
            proxy_pass $orig_loc;
            proxy_cache cache;
            proxy_cache_key $original_uri;
        }

        # Default route should not cache
        location / {
            proxy_cache off;
            proxy_pass https://$targetHost;
        }
    }
}
